name: Build Archer Mobile APKs (Customer & Driver)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Target API Base URL'
        required: true
        default: 'https://api.archerexecutivecar.com/api/v1'
      build_type:
        description: 'Build Type (apk / appbundle)'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - appbundle
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile-apks.yml'

jobs:
  build-apks:
    name: Build Mobile APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEFAULT_API_BASE_URL: 'https://api.archerexecutivecar.com/api/v1'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Environment & Accept Licenses
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Test archer_core
        run: |
          cd mobile/packages/archer_core
          flutter pub get
          flutter test

      - name: Build Customer App APK
        run: |
          API_URL="${{ inputs.api_base_url }}"
          if [ -z "$API_URL" ]; then
            API_URL="$DEFAULT_API_BASE_URL"
          fi
          echo "Building Customer APK targeting $API_URL"
          cd mobile/apps/customer_app
          flutter pub get
          flutter test
          flutter build apk --release \
            --android-skip-build-dependency-validation \
            --no-tree-shake-icons \
            --dart-define=API_BASE_URL="$API_URL"

      - name: Build Driver App APK
        run: |
          API_URL="${{ inputs.api_base_url }}"
          if [ -z "$API_URL" ]; then
            API_URL="$DEFAULT_API_BASE_URL"
          fi
          echo "Building Driver APK targeting $API_URL"
          cd mobile/apps/driver_app
          flutter pub get
          flutter test
          flutter build apk --release \
            --android-skip-build-dependency-validation \
            --no-tree-shake-icons \
            --dart-define=API_BASE_URL="$API_URL"

      - name: Stage APK Artifacts
        run: |
          mkdir -p release-apks
          cp mobile/apps/customer_app/build/app/outputs/flutter-apk/app-release.apk release-apks/archer-customer-executive.apk
          cp mobile/apps/driver_app/build/app/outputs/flutter-apk/app-release.apk release-apks/archer-driver-chauffeur.apk
          ls -la release-apks/

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: archer-customer-executive-apk
          path: release-apks/archer-customer-executive.apk
          retention-days: 14

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: archer-driver-chauffeur-apk
          path: release-apks/archer-driver-chauffeur.apk
          retention-days: 14

      - name: Upload All Release APKs Bundle
        uses: actions/upload-artifact@v4
        with:
          name: archer-all-mobile-apks
          path: release-apks/*.apk
          retention-days: 30

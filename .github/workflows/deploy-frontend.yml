name: Deploy Frontend Website

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Website
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.archerexecutivecar.com/api/v1
        run: |
          cd src
          npm ci
          node scripts/package-deploy.mjs

      - name: Copy Package to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: "deploy/archer-review.zip"
          target: "/tmp/"

      - name: Unzip & Restart Website on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            TARGET_DIR=${{ secrets.FRONTEND_DEPLOY_PATH || '/var/www/archer-website' }}
            mkdir -p "$TARGET_DIR"
            unzip -o /tmp/deploy/archer-review.zip -d "$TARGET_DIR"
            rm -rf /tmp/deploy
            cd "$TARGET_DIR"
            pm2 restart archer-website || pm2 start npm --name "archer-website" -- start

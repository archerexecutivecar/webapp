name: Smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  admin-api-smoke:
    name: Admin API smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run full backend test suite
        run: php artisan test

  frontend-typecheck:
    name: Frontend TypeScript checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Typecheck apps
        run: |
          for app in apps/admin apps/client apps/driver; do
            echo "=== $app ==="
            (cd "$app" && npm ci && npx tsc --noEmit)
          done
